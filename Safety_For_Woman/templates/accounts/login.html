{% extends "base.html" %}

{% block title %}Login - SafeHer{% endblock %}

{% block content %}
<div style="max-width:440px; margin:2.5rem auto;">
  <div class="card" style="padding:2rem;">
    <div style="text-align:center; margin-bottom:1.5rem;">
      <div style="font-size:2.5rem; margin-bottom:0.5rem;">🛡️</div>
      <h2 style="font-size:1.6rem; font-weight:800; color:var(--dark);">Sign in to SafeHer</h2>
      <p style="color:#64748b; font-size:0.9rem;">Arm your hands-free safety network</p>
    </div>

    <form method="POST" action="{% url 'accounts:login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" id="id_username" class="form-control" required placeholder="Enter username">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" id="id_password" class="form-control" required placeholder="Enter password">
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; padding:0.75rem; font-size:1rem; margin-top:0.5rem;">
        Sign In &amp; Arm Sensors
      </button>
    </form>

    <!-- Quick Demo Credential Filler -->
    <div style="margin-top:1.5rem; padding:0.85rem; background:#f8fafc; border:1px solid #e2e8f0; border-radius:0.5rem; text-align:center;">
      <p style="font-size:0.8rem; color:#64748b; margin-bottom:0.5rem;">Quick Demo Test Account:</p>
      <button type="button" onclick="fillDemoAccount()" class="btn btn-outline" style="font-size:0.8rem; padding:0.3rem 0.6rem; width:100%;">
        Use Demo User (Sarah Khumalo)
      </button>
    </div>

    <div style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:#64748b;">
      Don't have an account? <a href="{% url 'accounts:register' %}" style="color:var(--primary); font-weight:600;">Sign up</a>
    </div>
  </div>
</div>

<script>
function fillDemoAccount() {
  document.getElementById("id_username").value = "sarah";
  document.getElementById("id_password").value = "SafeHerPassword2026!";
}
</script>
{% endblock %}
